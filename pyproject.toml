[project]
name = "pyoupyou"
version = "1.23.0"
description = "ATS"
authors = [
    { name = "Benjamin Port", email = "benjamin.port@enioka.com" },
    { name = "Arnaud Chirat", email = "arnaud.chirat@enioka.com" },
    { name = "Thomas Cordival", email = "thomas.cordival@enioka.com" },
    { name = "Arnaud Baradat", email = "arnaud.baradat@enioka.com" },
]
requires-python = ">= 3.12, <3.15"
readme = "README.md"
dependencies = [
    "django-bootstrap-static>=3.3.7,<3.4",
    "django-crispy-forms==1.14.0",
    "django-select2==8.4.8",
    "django-extensions==3.2.3",
    "django-tables2==2.7.5",
    "django-ical==1.9.2",
    "django-bleach==3.1.0",
    "django-split-settings==1.2.0",
    "requests==2.34.2",
    "django-filter==25.1",
    "plotly==4.8.2",
    "numpy>=2.2.3",
    "pytz==2026.6",
    "pandas>=2.2.3",
    "django==5.2.*",
    "urllib3==2.8.0",
    "markdown-it-py==3.0.0",
    "djangorestframework==3.18.3",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-debug-toolbar==4.1.0",
    "factory-boy==3.1.0",
    "tzlocal",
    "coverage",
    "django-debug-toolbar-user-panel==2.0.0",
]
mysql = [
    "mysqlclient>=2.2.7",
]
