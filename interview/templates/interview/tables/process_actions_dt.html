{% load i18n %}
<a class="btn btn-info btn-xs"
    {% if process.start_date < user.date_joined.date and user not in process.responsible.all and user not in process.get_all_interviewers_for_process%}
        title="{% trans "You do not have the rights to access this process" %}"
        style="background-color: #5e5e5e; border-color: #4c4c4c"
        disabled
    {% else %}
        href="{{ process.get_absolute_url }}"
    {% endif %}>
    <i class="fa fa-folder-open" aria-hidden="true"></i> {% trans "Show" %}
</a>
